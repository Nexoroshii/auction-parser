spring:
  application:
    name: auction-parser
  # DataSource is defined programmatically in DatabaseConfig so the parent
  # directory can be created before SQLite opens the file.
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# Application-specific settings. Runtime-editable values (interval, telegram
# token, filters) live in the SQLite `settings`/`filters` tables; these are
# bootstrap defaults only.
app:
  data-dir: ${user.home}/.auctionnotifier
  monitoring:
    default-interval-minutes: 5
    # When true, a demo provider emits a synthetic lot each cycle so the
    # dedup -> persist -> Telegram pipeline can be exercised without the real
    # Copart/IAAI parsers. Keep false in production.
    demo-provider-enabled: false
    # How many days ahead (starting today) an auction may fall to be reported:
    # 1 = today only, 2 = today+tomorrow. Read fresh from this file on every
    # check — there is no in-app setting that can override it. In a packaged
    # build, config/application.yaml (next to the jar) takes precedence over
    # this file, so edit that copy instead.
    default-day-range: 2
  http:
    connect-timeout-seconds: 15
    request-timeout-seconds: 30
    max-retries: 3
    retry-backoff-millis: 1000
  # Прогонять трафик площадок через внешний US-прокси, чтобы НЕ держать
  # системный VPN. Нужен прокси с US-адресом (у многих VPN есть режим
  # прокси/SOCKS5; либо отдельный прокси-сервис).
  #   scheme: http  — рекомендуется, работает для Copart И IAAI/Telegram
  #   scheme: socks5 — только Copart (Java HTTP-клиент SOCKS не поддерживает)
  proxy:
    enabled: false
    scheme: http
    host: ""
    port: 0
    username: ""
    password: ""
  copart:
    # Set headless=false (and optionally slow-mo-millis) to watch the login flow
    # while tuning selectors against the real site.
    headless: true
    # Use a real installed browser instead of Playwright's bundled Chromium — a
    # much more convincing fingerprint against Imperva/Incapsula bot detection.
    # "msedge" = Microsoft Edge (ships with Windows), "chrome" = Google Chrome.
    # Leave empty to use bundled Chromium.
    channel: msedge
    login-url: https://www.copart.com/login/
    dashboard-url: https://www.copart.com/dashboard/
    navigation-timeout-seconds: 45
    slow-mo-millis: 0

logging:
  level:
    com.example.auctionparser: INFO
